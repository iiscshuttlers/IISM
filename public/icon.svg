<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iism-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="55%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="iism-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <!-- Feather Gradient -->
    <linearGradient id="iism-feather" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.88" />
    </linearGradient>

    <!-- Cork Gradient -->
    <linearGradient id="iism-cork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Speed Ribbon Gradient -->
    <linearGradient id="iism-speed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#iism-bg)" />

  <!-- Subtle Court Line / Ring -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#14b8a6" stroke-width="8" stroke-dasharray="20 16" opacity="0.35" />

  <!-- Motion Speed Trails -->
  <path d="M102 368 C 143 332, 194 317, 256 322" stroke="url(#iism-speed)" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M133 409 C 179 389, 225 384, 276 394" stroke="url(#iism-speed)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M82 317 C 123 281, 184 271, 235 276" stroke="url(#iism-speed)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Dynamic Badminton Shuttlecock Scaled & Centered -->
  <g transform="translate(30, -10)">
    <!-- Left vane -->
    <path d="M 168 281 C 174 235, 215 174, 266 143 C 256 189, 225 245, 194 296 Z" fill="url(#iism-feather)" opacity="0.8" />
    <!-- Center-left vane -->
    <path d="M 205 302 C 220 245, 266 179, 322 133 C 307 189, 271 251, 235 317 Z" fill="url(#iism-feather)" />
    <!-- Center-right vane -->
    <path d="M 240 322 C 261 261, 317 194, 373 158 C 353 215, 307 271, 266 332 Z" fill="url(#iism-feather)" />
    <!-- Right vane -->
    <path d="M 271 338 C 302 287, 358 230, 410 205 C 379 251, 328 302, 287 348 Z" fill="url(#iism-feather)" opacity="0.85" />

    <!-- Binding Thread / Ribbon Across Feathers -->
    <path d="M 184 271 C 225 261, 292 271, 368 297" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
    <path d="M 210 225 C 245 215, 302 225, 363 251" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" opacity="0.75" />

    <!-- Feather Ribs / Quills -->
    <path d="M 220 332 L 271 153" stroke="#0d9488" stroke-width="4" opacity="0.65" />
    <path d="M 245 348 L 328 143" stroke="#0d9488" stroke-width="4" opacity="0.75" />
    <path d="M 271 358 L 373 169" stroke="#0d9488" stroke-width="4" opacity="0.65" />

    <!-- Cork Collar / Dark Stripe -->
    <ellipse cx="225" cy="358" rx="33" ry="15" transform="rotate(-40 225 358)" fill="#042f2e" />

    <!-- Rounded Cork Dome -->
    <path d="M 194 338 C 179 353, 184 384, 205 399 C 225 415, 256 409, 266 389 C 256 373, 225 348, 194 338 Z" fill="url(#iism-cork)" />
    <!-- Cork Specular Highlight -->
    <circle cx="215" cy="379" r="8" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Glowing Crest Sparkle -->
  <circle cx="420" cy="92" r="15" fill="url(#iism-glow)" />
  <path d="M 420 61 L 420 123 M 389 92 L 450 92" stroke="#5eead4" stroke-width="5" stroke-linecap="round" opacity="0.8" />
</svg>
